mutation baseProductCategoryMoveAboveByUuids($categoryUuid: ID!, $productUuid: ID!, $targetProductUuid: ID!) {
  baseProductCategoryMoveAboveByUuids(categoryUuid: $categoryUuid, productUuid: $productUuid, targetProductUuid: $targetProductUuid) {
    uuid
    baseProductUuid
    categoryUuid
    categoryId
    isDefault
    sortOrder
    createdAt
    lastModifiedAt
  }
}
