mutation productCategoryMoveAbove($relationshipUuid: ID!, $targetRelationshipUuid: ID!) {
  productCategoryMoveAbove(relationshipUuid: $relationshipUuid, targetRelationshipUuid: $targetRelationshipUuid) {
    uuid
    productId
    categoryId
    isDefault
    sortOrder
    createdAt
    lastModifiedAt
  }
}
